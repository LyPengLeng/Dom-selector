
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You</title>

    <style>
        body {
            text-align: center;
            margin-top: 150px;
            font-family: Arial, sans-serif;
            background-color: pink;
        }

        h1 {
            color: red;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #loveBtn {
            background-color: red;
            color: white;
        }

        #yesBtn {
            background-color: green;
            color: white;
        }

        #noBtn {
            background-color: gray;
            color: white;
        }

        #message {
            font-size: 25px;
            color: red;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>💗 I Love You sada 💗</h1>

    <button id="loveBtn">I Love You ❤️</button>

    <br>

    <button id="yesBtn">Yes 💕</button>
    <button id="noBtn">No 😢</button>

    <p id="message"></p>

    <script src="script.js"></script>

</body>
</html>
